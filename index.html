<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nexxus Compagnon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a0e19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : écran unique. Le visage occupe tout ; verrouillé, il devient un noyau entouré d'anneaux.
   Une fiche glisse à droite (ou en bas sur téléphone) quand il présente une info. */
:root{
  --ink:#0a0e19;
  --ink-2:#121a2b;
  --ink-3:#1a2338;
  --line:#26304c;
  --text:#ecEFF7;
  --muted:#7b85a3;
  --glow:#ffb36b;
  --glow-soft:rgba(255,179,107,.12);
  --bad:#ff5d5d;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--display);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
.stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,#151d33 0%,var(--ink) 62%);cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
#cv{position:absolute;inset:0;width:100%;height:100%}

.status{transition:opacity .8s;position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;pointer-events:none;z-index:3}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .3s,box-shadow .3s}
.status.on i{background:var(--glow);box-shadow:0 0 10px var(--glow)}

/* ---------- écran de verrouillage ---------- */
.lock{position:fixed;inset:0;pointer-events:none;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(40px + env(safe-area-inset-top,0px)) 16px calc(92px + env(safe-area-inset-bottom,0px));text-align:center;transition:opacity .5s}
.lock.off{opacity:0}
.lk-time{font-weight:300;font-size:clamp(56px,10vw,112px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.lk-date{color:var(--muted);margin-top:8px;font-size:15px}
.lk-os{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--glow);margin-bottom:14px;opacity:.85}
.lk-state{font-family:var(--mono);font-size:clamp(13px,1.6vw,16px);letter-spacing:.32em;text-transform:uppercase;color:var(--glow);min-height:1.4em}
.lk-state.bad{color:var(--bad)}
.lk-hint{color:var(--muted);font-size:14px;margin-top:10px;min-height:1.3em}

/* ---------- sous-titres ---------- */
.caption{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:clamp(17px,2.2vw,23px);line-height:1.45;text-wrap:balance;max-width:760px;margin:0 auto;pointer-events:none;transition:opacity .6s,right .5s;z-index:2}
.caption .you{display:block;color:var(--muted);font-size:.75em;margin-bottom:6px}
.caption .tag{font-family:var(--mono);font-size:11px;color:var(--glow);letter-spacing:.1em;text-transform:uppercase;margin-left:8px;vertical-align:middle}
.caption.fade{opacity:0}
.hint{position:fixed;left:0;right:0;bottom:calc(32px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);pointer-events:none;z-index:2}

/* ---------- boutons ---------- */
.tools{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px;z-index:5;transition:opacity .8s}
.tiroir{display:flex;flex-direction:column-reverse;gap:10px;align-items:center}
.tools:not(.ouvert) .tiroir{display:none}
.tiroir .tbtn{animation:sortir .25s ease-out both}
@keyframes sortir{from{opacity:0;transform:translateY(10px) scale(.8)}}
.bas{display:flex;gap:10px}
/* interface qui s'efface quand on ne touche à rien */
body.calme .tools:not(.ouvert),body.calme .status{opacity:.18}
body.calme .tools:not(.ouvert):hover{opacity:1}
.tbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--ink-2);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.tbtn svg{width:20px;height:20px}
.tbtn:hover{color:var(--glow);border-color:var(--glow)}
.tbtn.on{color:var(--ink);background:var(--glow);border-color:var(--glow)}
.timers{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:6;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.timer{display:flex;align-items:baseline;gap:8px;font:inherit;background:var(--ink-2);border:1px solid var(--glow);color:var(--text);border-radius:999px;padding:6px 12px;cursor:pointer}
.timer .t-nom{font-size:12px;color:var(--muted)}
.timer .t-val{font-family:var(--mono);font-size:15px;color:var(--glow);font-variant-numeric:tabular-nums}
body.fiche-on .timers{right:calc(min(540px,48vw) + 48px)}
.kbd{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 110px);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5}
#ask{width:100%;box-sizing:border-box;font:inherit;font-size:16px;background:var(--ink-2);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:12px 56px 12px 18px}
.envoi{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:none;background:var(--glow);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.envoi svg{width:18px;height:18px}
.envoi:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#ask:focus,.tbtn:focus-visible,.f-close:focus-visible,.stage:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

/* ---------- fiche ---------- */
.fiche{position:fixed;z-index:4;top:calc(20px + env(safe-area-inset-top,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));
  width:min(540px,48vw);background:var(--ink-2);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;
  transform:translateX(calc(100% + 40px));transition:transform .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.fiche.open{transform:none}
.fiche.compact{bottom:auto;max-height:calc(100% - 120px)}
.f-prog{height:3px;background:var(--line);flex:none}
.f-prog i{display:block;height:100%;width:0;background:var(--glow);box-shadow:0 0 12px var(--glow)}
.f-scroll{overflow-y:auto;flex:1;min-height:0}
.f-hero{position:relative;aspect-ratio:16/10;max-width:100%;background:radial-gradient(circle at 30% 30%,var(--glow-soft),transparent 60%),var(--ink-3);overflow:hidden}
.f-hero img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 18s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.f-hero .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:800;color:var(--glow);opacity:.25}
.f-hero::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--ink-2))}
.f-credit{position:absolute;right:12px;top:10px;z-index:1;font-family:var(--mono);font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:6px}
.f-thumbs{display:flex;gap:8px;padding:0 22px;margin-top:-28px;position:relative;z-index:1}
.f-thumbs button{width:58px;height:42px;border-radius:8px;overflow:hidden;border:2px solid var(--line);padding:0;cursor:pointer;background:var(--ink-3)}
.f-thumbs button.on{border-color:var(--glow)}
.f-thumbs img{width:100%;height:100%;object-fit:cover}
.f-body{padding:18px 22px 24px;display:flex;flex-direction:column;gap:14px}
.f-sub{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--glow)}
.f-title{font-size:clamp(26px,3vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
.f-resume{font-size:16px;line-height:1.55;color:#cfd4e3;margin:0}
.f-points{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0}
.f-points div{background:var(--ink-2);padding:12px 14px;min-width:0;opacity:0;transform:translateY(8px);animation:up .5s ease-out forwards}
.f-points dt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.f-points dd{margin:4px 0 0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
@keyframes up{to{opacity:1;transform:none}}
.f-src{display:flex;flex-direction:column;gap:6px}
.f-src a{color:var(--muted);font-size:13px;text-decoration:none;border-bottom:1px solid transparent;width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-src a:hover{color:var(--glow);border-color:var(--glow)}
.f-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.f-close{position:absolute;top:14px;left:14px;z-index:2;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;font-size:18px;line-height:1}
.f-tag{font-family:var(--mono);font-size:10px;color:var(--ink);background:var(--glow);padding:2px 6px;border-radius:4px;margin-left:8px;letter-spacing:.1em}
body.fiche-on .caption{opacity:0}
@media (max-width:820px){
  .fiche{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;top:auto;height:62vh;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateY(calc(100% + 100px))}
  body.fiche-on .caption{opacity:0}
  .fiche.compact{height:auto;max-height:62vh;bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
/* ---------- réglages ---------- */
.reglages{position:fixed;z-index:7;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));max-height:calc(100% - 120px);overflow-y:auto;box-sizing:border-box;
  background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.r-titre{font-weight:800;font-size:20px;margin:0;display:flex;justify-content:space-between;align-items:center}
.r-x{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
.r-grp{display:flex;flex-direction:column;gap:8px}
.r-lab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink-2);outline:2px solid transparent;cursor:pointer;padding:0}
.sw.on{outline-color:var(--text)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg button{font:inherit;font-size:14px;background:var(--ink-3);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;cursor:pointer}
.seg button.on{border-color:var(--glow);color:var(--glow)}
.r-row{display:flex;gap:8px;flex-wrap:wrap}
.r-btn{font:inherit;font-size:14px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.r-btn:hover{border-color:var(--glow);color:var(--glow)}
.r-btn.on{border-color:var(--glow);color:var(--ink);background:var(--glow)}
.diag{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:14px;align-items:start}
.diag .ic{font-family:var(--mono);font-weight:500}
.diag .ic.ok{color:var(--ok,#5fd3a0)}
.diag .ic.ko{color:var(--bad)}
.diag b{font-weight:600}
.diag small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.diag .aide{color:var(--text);font-size:12px;margin-top:2px}
#rVol,#rDebit{width:100%;accent-color:var(--glow)}
.r-note{color:var(--muted);font-size:12px}
#rVerrou{font:inherit;background:var(--ink-3);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}
.sw:focus-visible,.seg button:focus-visible,.r-btn:focus-visible,#rVerrou:focus-visible,#rVol:focus-visible,.r-x:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

/* ---------- écran de veille, nuit, sous-titres karaoké ---------- */
.veille{position:fixed;left:0;right:0;top:calc(9vh + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s;z-index:1}
.veille.on{opacity:.8}
.v-time{font-weight:300;font-size:clamp(64px,12vw,140px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.v-info{color:var(--muted);margin-top:10px;font-size:16px}
.dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity 2s}
.dim.on{opacity:.4}
.caption .w{color:var(--muted);transition:color .25s}
.caption .w.dit{color:var(--text)}
/* ---------- panneau des départs ---------- */
.tb-head{padding:22px 22px 6px;display:flex;flex-direction:column;gap:6px}
.tb-route{font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
.tb-rows{display:flex;flex-direction:column;padding:8px 14px 18px}
.tb-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line);opacity:0;transform:translateY(8px);animation:up .45s ease-out forwards}
.tb-row:last-child{border-bottom:none}
.tb-badge{min-width:44px;height:40px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--ink-3);color:var(--text);box-sizing:border-box}
.tb-dir{min-width:0}
.tb-dir b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-dir small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:3px}
.tb-min{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--glow);font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.tb-min small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);margin-top:4px}
.tb-min.now{animation:clign 1s steps(2) infinite}
@keyframes clign{50%{opacity:.35}}
.tb-note{padding:0 22px 22px;color:var(--muted);font-size:13px}
/* ---------- appareil photo ---------- */
.cam{position:fixed;inset:0;z-index:9;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cam-bar{display:flex;align-items:center;justify-content:space-around;gap:16px;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#000}
.cam-bar .r-btn{color:#fff;border-color:#444}
.cam-shot{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:var(--glow);cursor:pointer;flex:none}
.cam-shot:active{transform:scale(.94)}
.cam-msg{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:16px;right:16px;text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 6px #000}
.cam-shot:focus-visible,.cam-bar .r-btn:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.photo-vue{position:fixed;z-index:3;left:max(16px,env(safe-area-inset-left,0px));top:calc(48px + env(safe-area-inset-top,0px));width:min(220px,34vw);border:6px solid #f2efe8;border-bottom-width:22px;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-4deg);animation:pola .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pola{from{transform:rotate(-14deg) translateY(-30px) scale(.7);opacity:0}}
/* ---------- mini-jeux ---------- */
.jeu-body{display:flex;flex-direction:column;gap:16px;padding:8px 22px 24px}
.jeu-texte{font-size:clamp(22px,2.6vw,30px);font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.jeu-texte.pendu{font-family:var(--mono);letter-spacing:.35em;font-size:clamp(28px,4vw,42px);color:var(--glow)}
.jeu-texte.pfc{font-size:64px;letter-spacing:.1em;text-align:center}
.jeu-info{color:var(--muted);font-size:14px;margin:0}
.jeu-score{font-family:var(--mono);font-size:13px;color:var(--glow);border:1px solid var(--glow);border-radius:999px;padding:4px 12px;width:fit-content}
.jeu-choix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.jeu-choix button{font:inherit;font-size:16px;text-align:left;background:var(--ink-3);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;min-width:0}
.jeu-choix button b{font-family:var(--mono);color:var(--glow);flex:none}
.jeu-choix button span{min-width:0;overflow-wrap:anywhere}
.jeu-choix button:hover,.jeu-choix button:focus-visible{border-color:var(--glow);outline:none}
.jeu-choix button.choisi{border-color:var(--glow);background:var(--glow-soft)}
@media (max-width:480px){.jeu-choix{grid-template-columns:1fr}}
/* ---------- infos du jour ---------- */
.inf-liste{list-style:none;margin:0;padding:6px 14px 20px;display:flex;flex-direction:column;gap:4px;counter-reset:inf}
.inf-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:14px 10px;border-radius:14px;transition:background .4s,opacity .4s;counter-increment:inf}
.inf-item::before{content:counter(inf);grid-row:span 3;font-family:var(--mono);font-size:22px;color:var(--muted);line-height:1.2;transition:color .4s}
.inf-item.lu{opacity:.55}
.inf-item.actif{background:var(--glow-soft);opacity:1}
.inf-item.actif::before{color:var(--glow)}
.inf-cat{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--glow)}
.inf-titre{font-size:18px;font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
.inf-res{font-size:14px;line-height:1.5;color:#cfd4e3;margin:0}
.inf-src{font-size:12px;color:var(--muted)}
.ag-body{display:flex;flex-direction:column;gap:10px;padding:10px 22px 24px}
.ag-body .r-lab{margin-top:8px}
.ag-vide{color:var(--muted);font-size:14px;margin:0}
.ag-rap{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--ink-3);border-left:3px solid var(--glow)}
.ag-quand{font-family:var(--mono);font-size:12px;color:var(--glow)}
.ag-txt{font-size:16px;min-width:0;overflow-wrap:anywhere}
.ag-tache{display:flex;align-items:center;gap:12px;font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;transition:opacity .4s}
.ag-tache:hover{border-color:var(--glow)}
.ag-case{width:20px;height:20px;border-radius:6px;border:2px solid var(--glow);flex:none;display:grid;place-items:center}
.ag-tache.fait{opacity:.4}
.ag-tache.fait .ag-case{background:var(--glow)}

<script>
/* ================= RÉGLAGES ================= */
const CONFIG = {
  nom: "Nexxus",
  prenom: "Hector",
  relay: "relay.php",
  ville: "Paris", lat: 48.8566, lon: 2.3522,
  phraseDemo: "protocole nexxus",   // utilisée seulement quand le relais est absent (aperçu)
  verrouAuto: 15                     // minutes sans parler avant verrouillage auto
};
/* ============================================ */

const COULEURS = {ambre:[255,179,107], cyan:[94,234,212], violet:[178,150,255], rose:[255,128,170], vert:[140,235,150]};
const STYLES = {pote:"Pote", majordome:"Majordome", sarcastique:"Sarcastique", prof:"Prof"};
const THEMES = {classique:"Classique", chat:"Chat", pixel:"Pixel", neon:"Néon"};
let REG = {couleur:"ambre", style:"pote", volume:1, verrou:CONFIG.verrouAuto, theme:"classique", bruit:false, voixClaude:"buttery", voixAzure:"fr-FR-RemyMultilingualNeural", debit:1};
try{ Object.assign(REG, JSON.parse(localStorage.getItem("nexxus_reglages")||"{}")); }catch(e){}
if(!COULEURS[REG.couleur]) REG.couleur = "ambre";
if(!STYLES[REG.style]) REG.style = "pote";
if(!THEMES[REG.theme]) REG.theme = "classique";
function sauverReglages(){ try{ localStorage.setItem("nexxus_reglages", JSON.stringify(REG)); }catch(e){} }
function appliquerCouleur(){
  const [r,g,b] = COULEURS[REG.couleur], st = document.documentElement.style;
  st.setProperty("--glow", `rgb(${r},${g},${b})`); st.setProperty("--glow-soft", `rgba(${r},${g},${b},.14)`);
}
appliquerCouleur();
const nuit = ()=>{ const h = new Date().getHours(); return h>=23 || h<7; };
const volumeEffectif = ()=> REG.volume * (nuit() ? .55 : 1);

const $ = id => document.getElementById(id);
// vieux navigateurs (Android/iOS anciens) : roundRect n'existe pas -> sinon tout le dessin plante
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    r = Math.max(0, Math.min(r, w/2, h/2));
    this.moveTo(x+r, y); this.arcTo(x+w, y, x+w, y+h, r); this.arcTo(x+w, y+h, x, y+h, r);
    this.arcTo(x, y+h, x, y, r); this.arcTo(x, y, x+w, y, r); this.closePath(); return this;
  };
}
// un appel au serveur ne peut plus bloquer l'appareil indéfiniment
function requete(action, corps, delai=20000){
  const ctrl = new AbortController(), t = setTimeout(()=>ctrl.abort(), delai);
  const opt = {credentials:"same-origin", signal:ctrl.signal};
  if(corps!==undefined){ opt.method = "POST"; opt.headers = {"Content-Type":"application/json"}; opt.body = JSON.stringify(corps); }
  return fetch(`${CONFIG.relay}?a=${action}`, opt).finally(()=>clearTimeout(t));
}
const fmtH = d => d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}).replace(":"," h ");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r=>setTimeout(r, ms));
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOut = t => 1-Math.pow(1-t,3);

let etat = "verrou";          // verrou | auth | ouverture | actif | fermeture
let horsLigne = false;
let stockageLocal = false;   // sur Vercel : agenda et souvenirs gardés sur l'appareil
/* Dans Claude, la page a son propre cerveau (Claude), ses voix et sa dictée, sans ton serveur. */
const CAP = {sample:null, tts:null, dict:null, outils:false, images:false, pret:false};
let cerveauRefuse = false, ttsRefuse = false, dicteeSansLangue = false;
const cerveauClaude = ()=> horsLigne && !!CAP.sample && !cerveauRefuse;
(async()=>{
  if(!window.claude || typeof window.claude.use !== "function"){ CAP.pret = true; return; }
  const [s, t, d] = await Promise.all(["sample","tts","dictation"].map(n=> window.claude.use(n).catch(()=>null)));
  CAP.sample = s; CAP.tts = t; CAP.dict = d;
  if(s){ const l = await s.limits().catch(()=>null); CAP.outils = !!l?.tools; CAP.images = !!l?.images; }
  if(t){ t.onState(({state, reason})=>{ ttsEtat = state; if(reason==="not_granted" || reason==="unavailable") ttsRefuse = true; }); }
  CAP.pret = true;
})();
let ttsEtat = "idle";
let derniereActivite = Date.now();

/* ---------------- horloge de l'écran verrouillé ---------------- */
function tick(){
  const d = new Date();
  $("lkTime").textContent = d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  $("lkDate").textContent = d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
tick(); setInterval(tick, 1000);

/* ---------------- texte qui se décode ---------------- */
const GLYPHES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&/<>*";
let decodeId = 0;
function decoder(el, texte, duree=700){
  const id = ++decodeId;
  if(reduce){ el.textContent = texte; return; }
  const t0 = performance.now();
  (function f(now){
    if(id!==decodeId) return;
    const p = Math.min(1,(now-t0)/duree), n = Math.floor(p*texte.length);
    el.textContent = texte.slice(0,n) + [...texte.slice(n)].map(c=>c===" "?" ":GLYPHES[Math.floor(Math.random()*GLYPHES.length)]).join("");
    if(p<1) requestAnimationFrame(f);
  })(t0);
}
function lockTexte(etatTxt, hint="", mauvais=false){
  $("lkState").classList.toggle("bad", mauvais);
  decoder($("lkState"), etatTxt);
  $("lkHint").textContent = hint;
}

/* ---------------- sons (synthétisés, aucun fichier) ---------------- */
let actx = null, analyser = null, buf = null, audioLive = false;
const audioEl = new Audio();
function initAudio(){
  try{
    if(!actx){
      actx = new (window.AudioContext||window.webkitAudioContext)();
      analyser = actx.createAnalyser(); analyser.fftSize = 512; buf = new Uint8Array(analyser.fftSize);
      actx.createMediaElementSource(audioEl).connect(analyser); analyser.connect(actx.destination);
    }
    if(actx.state==="suspended") actx.resume();
    if(!audioDebloque){ audioDebloque = true; audioEl.src = SILENCE; audioEl.play().catch(()=>{}); }  // iPhone : autorise la lecture plus tard
  }catch(e){}
  garderEcran();
  if(window.DeviceMotionEvent?.requestPermission && !mouvementDemande){ mouvementDemande = true; DeviceMotionEvent.requestPermission().catch(()=>{}); }
  demarrerBruit();
}
let mouvementDemande = false;
let audioDebloque = false;
const SILENCE = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
let wakeLock = null;
async function garderEcran(){
  try{ if("wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; }); } }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="visible") return;
  if(actx){ garderEcran(); if(actx.state!=="running") actx.resume().catch(()=>{}); }
  verifierSession();
});
addEventListener("offline", ()=>{ if(etat==="actif"){ sousTitre("", "Plus de connexion internet. Je t'attends.", ""); mood("perdu"); } });
addEventListener("online", ()=>{ if(etat==="actif" && !occupe){ sousTitre("", "Connexion retrouvée.", ""); mood("content"); setTimeout(()=>{ if(F.mood==="content") mood("veille"); }, 2000); } });
function ton(f0, f1, dur, type="sine", vol=.18, debut=0){
  if(!actx || !voixOn) return;
  vol *= volumeEffectif(); if(vol < .002) return;
  const t = actx.currentTime + debut, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.05);
}
const SFX = {
  blip:  ()=>ton(1400,1600,.07,"sine",.08),
  scan:  ()=>{ ton(220,880,.9,"sawtooth",.04); ton(440,1760,.9,"sine",.05); },
  ouvrir:()=>{ ton(160,1200,.55,"triangle",.16); ton(880,880,.35,"sine",.12,.55); ton(1320,1320,.6,"sine",.1,.7); ton(55,40,1.2,"sine",.25,.5); },
  refus: ()=>{ ton(140,110,.18,"square",.09); ton(140,90,.25,"square",.09,.24); },
  fermer:()=>{ ton(1100,70,.8,"triangle",.15); ton(60,30,.9,"sine",.2,.3); },
  fiche: ()=>{ ton(600,900,.12,"sine",.07); ton(900,1200,.12,"sine",.06,.08); }
};

/* ---------------- VISAGE + HUD ---------------- */
const cv = $("cv"), cxMain = cv.getContext("2d");
let cx = cxMain;
// thème pixel : le visage est dessiné en tout petit puis agrandi sans lissage
const pc = document.createElement("canvas"), pcx = pc.getContext("2d");
Object.defineProperty(pcx, "shadowBlur", {get(){ return 0; }, set(){}});
const F = {mood:"veille", lx:0, ly:0, tx:0, ty:0, lookT:0, blink:0, nextBlink:2, open:0, emo:null, clinT:0, clinCote:1, prochainClin:25, yeux:[], cx:0, cy:0};
const HUD = {p:.75, r:1, spin:1, rouge:0, prog:0, shake:0, scan:-1, flash:0, ang:0};
const E = {h:1, w:1, smile:0, mouth:0, slant:0};
const PARTS = [];
let ficheOn = 0, ficheT = 0;
const EMO = {surpris:{h:1.3,w:1.15,slant:0,smile:0}, fache:{h:.8,w:1.05,slant:1,smile:0}, triste:{h:.9,w:.95,slant:-1,smile:0},
             content:{h:1,w:1.05,slant:0,smile:1}, clin:{h:1,w:1.05,slant:0,smile:0}, perdu:{h:.85,w:.9,slant:0,smile:0}};
let emoT = null;
function emotion(e, duree=0){ F.emo = EMO[e] ? e : null; clearTimeout(emoT); if(e==="clin") clin(); if(duree) emoT = setTimeout(()=>{ F.emo = null; }, duree); }
function clin(cote=1){ setTimeout(()=>{ F.clinT = .55; F.clinCote = cote; }, 350); }
const MOODS = {veille:"En ligne", dort:"Je somnole", ecoute:"J'écoute", pense:"Je réfléchis", cherche:"Je cherche", parle:"Je parle", content:"Content", perdu:"Pas compris"};
function mood(m){ F.mood = m; if(etat==="actif"){ $("statusTxt").textContent = MOODS[m]; $("status").classList.toggle("on", !["veille","dort"].includes(m)); } }
let qualite = 1;   // 1 = haute, 0 = économie
function fit(){ const p = qualite ? Math.min(2, devicePixelRatio||1) : 1; cv.width = innerWidth*p; cv.height = innerHeight*p; cx.setTransform(p,0,0,p,0,0); }
addEventListener("resize", fit); fit();

function couleur(a=1){ // couleur choisie -> rouge selon HUD.rouge
  const [r0,g0,b0] = COULEURS[REG.couleur], k = HUD.rouge;
  return `rgba(${Math.round(r0+(255-r0)*k)},${Math.round(g0+(93-g0)*k)},${Math.round(b0+(93-b0)*k)},${a})`;
}
function anneaux(x, y, s, now){
  const p = HUD.p; if(p<=.01) return;
  const R = 235*s*HUD.r, sp = HUD.spin;
  cx.save(); cx.translate(x, y);
  cx.shadowColor = couleur(.8); cx.shadowBlur = qualite ? 14*s*p : 0;
  // anneau pointillé
  const A = HUD.ang;
  cx.save(); cx.rotate(A*.15); cx.setLineDash([2*s, 9*s]); cx.lineWidth = 1.5*s; cx.strokeStyle = couleur(.55*p);
  cx.beginPath(); cx.arc(0,0,R,0,Math.PI*2); cx.stroke(); cx.restore();
  // trois arcs épais
  cx.save(); cx.rotate(-A*.35); cx.lineWidth = 4*s; cx.lineCap = "round"; cx.strokeStyle = couleur(.85*p);
  for(let i=0;i<3;i++){ cx.beginPath(); cx.arc(0,0,R*1.12, i*2.094, i*2.094+1.1); cx.stroke(); }
  cx.restore();
  // graduations
  cx.save(); cx.rotate(A*.06); cx.strokeStyle = couleur(.35*p); cx.lineWidth = 1.2*s;
  for(let i=0;i<72;i++){ const a = i/72*Math.PI*2, L = i%6===0 ? 16*s : 6*s; cx.beginPath(); cx.moveTo(Math.cos(a)*R*1.25, Math.sin(a)*R*1.25); cx.lineTo(Math.cos(a)*(R*1.25+L), Math.sin(a)*(R*1.25+L)); cx.stroke(); }
  cx.restore();
  // jauge de progression (boot / identification)
  if(HUD.prog>0){ cx.lineWidth = 3*s; cx.strokeStyle = couleur(p); cx.beginPath(); cx.arc(0,0,R*.9,-Math.PI/2,-Math.PI/2+HUD.prog*Math.PI*2); cx.stroke(); }
  cx.restore();
}

/* ---------------- VIE : petites animations quand il ne fait rien ---------------- */
// chaque animation renvoie des modificateurs pour p (0 → 1) : h/w = taille des yeux, dy = décalage vertical, bouche = bâillement
const ANIMS = {
  etirement:{duree:1.7, f:p=>{ const k = Math.sin(Math.PI*p); return {h:1+.38*k, w:1-.14*k, dy:-14*k}; }},
  baillement:{duree:2.8, f:p=>{ const k = Math.sin(Math.PI*Math.min(1,p*1.15)); return {h:1-.72*k, w:1+.06*k, dy:4*k, bouche:k}; }},
  soupir:{duree:2.2, f:p=>{ const k = Math.sin(Math.PI*p); return {h:1-.4*k, dy:10*k}; }},
  sursaut:{duree:.6, f:p=>{ const k = Math.sin(Math.PI*p); return {h:1+.3*k, w:1+.1*k, dy:-22*k}; }},
  vertige:{duree:2.6, f:p=>({spirale: p<.92})},
  tour:{duree:2.2, f:p=>{ const a = p*Math.PI*2 - Math.PI/2; F.tx = Math.cos(a)*.8; F.ty = Math.sin(a)*.7; F.lookT = .3; return {}; }},
  doubleClin:{duree:.9, f:p=>{ if(p<.05 || (p>.45 && p<.5)) F.blink = 1; return {}; }},
};

function jouerPfc(n){

    emotion(pfc.toi>=pfc.moi ? "content" : "clin", 2500); return dire(fin + (pfc.toi>pfc.moi ? " Bien joué, tu m'as eu !" : pfc.toi<pfc.moi ? " J'ai gagné, hé hé." : " Égalité !"), "content"); }
  const m = n.match(/\b(pierre|feuille|ciseaux?)\b/); if(!m){ pfc.actif = false; return null; }   // il parle d'autre chose : fin du jeu
  const toi = m[1].startsWith("ciseau") ? "ciseaux" : m[1];
  const moi = ["pierre","feuille","ciseaux"][Math.floor(crypto.getRandomValues(new Uint8Array(1))[0] % 3)];
  const bat = {pierre:"ciseaux", feuille:"pierre", ciseaux:"feuille"};
  let res, emo;
  if(toi===moi){ res = "Égalité !"; emo = "surpris"; }
  else if(bat[toi]===moi){ pfc.toi++; res = ["Argh, tu as gagné !", "Pas mal du tout…", "Encore toi ?!"][pfc.toi%3]; emo = "fache"; }
  else { pfc.moi++; res = ["Gagné !", "Trop facile.", "Je suis imbattable."][pfc.moi%3]; emo = "clin"; }
  ouvrirJeu({jeu:"pfc", titre:"Pierre, feuille, ciseaux", texte:`${SIGNES[toi]}  ${SIGNES[moi]}`, score:`Toi ${pfc.toi} · Moi ${pfc.moi}`, info:`Toi : ${toi} · Moi : ${moi}. On rejoue ? Dis pierre, feuille ou ciseaux.`});

  return dire(`J'ai fait ${moi}. ${res}`, "veille");
}

// découpe en morceaux : la 1re phrase seule pour démarrer vite, puis des blocs de ~220 caractères
function decouper(texte){
  const phrases = texte.match(/[^.!?…]+[.!?…]+["»)]*\s*|[^.!?…]+$/g) || [texte];
  const out = []; let cur = "";
  phrases.forEach((ph,i)=>{ ph = ph.trim(); if(!ph) return;
    if(i===0){ out.push(ph); return; }
    if((cur+" "+ph).length > 220 && cur){ out.push(cur); cur = ph; } else cur = cur ? cur+" "+ph : ph; });
  if(cur) out.push(cur);
  return out;
}
function voixNavigateur(texte){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)){ const t = setTimeout(res, texte.length*55); stopParole = ()=>{ clearTimeout(t); res(); }; return; }
    const v = speechSynthesis.getVoices();
    if(ttsRefuse){ const t = setTimeout(res, 400 + texte.length*45); stopParole = ()=>{ clearTimeout(t); res(); }; return; }   // voix coupée par toi : texte seulement
    const u = new SpeechSynthesisUtterance(texte); u.lang = "fr-FR"; u.rate = 1.03*REG.debit; u.volume = Math.min(1, volumeEffectif());
    const p0 = progression, part = 1 - p0;
    u.onboundary = e=>{ if(e.charIndex!=null) progression = p0 + part*Math.min(1, e.charIndex/texte.length); };
    u.voice = v.find(x=>/fr/i.test(x.lang) && /natural|neural|online|google/i.test(x.name)) || v.find(x=>/fr/i.test(x.lang)) || null;
    let ok = false; const fin = ()=>{ if(!ok){ ok = true; res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 1500 + texte.length*70);
    stopParole = ()=>{ speechSynthesis.cancel(); fin(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(()=>{ if(!speechSynthesis.speaking && !speechSynthesis.pending) setTimeout(fin, texte.length*55); }, 1200); // navigateur muet
  });
}

async function voixClaude(texte){

  const p0 = progression;
  F.pause = true;
  const off = t.onState(({state})=>{ F.pause = state!=="speaking"; });
  const iv = setInterval(()=>{ if(!F.pause) progression = Math.min(1, p0 + (1-p0)*(Date.now()-debut)/duree); }, 100);
  stopParole = ()=>{ t.stop().catch(()=>{}); };
  try{ await t.speak(texte.slice(0, 2000), {voice:REG.voixClaude, language:"fr", rate:REG.debit}); }
  catch(e){
    if(e.code==="not_granted" || e.code==="unavailable"){ ttsRefuse = true; return; }   // il a coupé la voix : on n'en impose pas une autre
    if(e.code!=="stopped") throw e;
  }
  finally{ clearInterval(iv); off(); F.pause = false; }
}
async function audioAzure(texte){
  const r = await requete("tts", {texte, voix:REG.voixAzure, debit:REG.debit}, 15000);
  if(!r.ok || !(r.headers.get("content-type")||"").includes("audio")) throw new Error("tts");
  return URL.createObjectURL(await r.blob());
}
function jouer(url){
  return new Promise((res, rej)=>{
    audioEl.src = url; audioLive = true; audioEl.volume = Math.min(1, volumeEffectif());
    audioEl.onended = ()=>res(true); audioEl.onerror = ()=>rej(new Error("lecture"));
    stopParole = ()=>{ audioEl.pause(); res(false); };
    audioEl.play().catch(rej);
  });
}
// joue les morceaux à la suite en préparant le suivant pendant que le précédent parle
async function voixRealiste(texte){
  if(horsLigne){ if(CAP.tts && !ttsRefuse) return voixClaude(texte); throw new Error("hors ligne"); }
  const morceaux = decouper(texte), n = morceaux.length, total = morceaux.reduce((a,m)=>a+m.length, 0) || 1;
  let avant = 0;
  const pf = t=>{ const p = audioAzure(t); p.catch(()=>{}); return p; };   // évite les erreurs non gérées
  const prets = [pf(morceaux[0])];
  if(n>1) prets.push(pf(morceaux[1]));
  let url0; try{ url0 = await prets[0]; }catch(e){ throw e; }       // rien n'a encore été dit : la voix du navigateur prend le relais
  for(let i=0;i<n;i++){
    if(i+2<n) prets.push(pf(morceaux[i+2]));
    let url;
    try{ url = i===0 ? url0 : await prets[i]; }
    catch(e){ audioLive = false; await voixNavigateur(morceaux.slice(i).join(" ")); return; }
    const suivi = setInterval(()=>{ if(audioEl.duration) progression = (avant + morceaux[i].length*audioEl.currentTime/audioEl.duration)/total; }, 100);
    let continuer;
    try{ continuer = await jouer(url); }
    catch(e){ clearInterval(suivi); audioLive = false; await voixNavigateur(morceaux.slice(i).join(" ")); return; }
    clearInterval(suivi); URL.revokeObjectURL(url); avant += morceaux[i].length;
    if(!continuer){ prets.slice(i+1).forEach(p=>p.then(u=>URL.revokeObjectURL(u)).catch(()=>{})); break; }
  }
  audioLive = false;
}
async function dire(texte, apres="veille", you="", tag=""){
  sousTitre(you, texte, tag, true);
  mood("parle"); progression = 0;
  pauseOreille(); baisserMusique(true);
  if(voixOn){ try{ await voixRealiste(texte); }catch(e){ audioLive = false; await voixNavigateur(texte); } }
  else await new Promise(r=>{ const d = 600 + texte.length*45, t0 = Date.now();
    const iv = setInterval(()=>{ progression = Math.min(1,(Date.now()-t0)/d); if(progression>=1){ clearInterval(iv); r(); } }, 80);
    stopParole = ()=>{ clearInterval(iv); r(); }; });
  stopParole = null; audioLive = false; progression = 1; baisserMusique(false);
  if(etat!=="actif" && etat!=="ouverture" && etat!=="fermeture") return;
  mood(apres); if(apres!=="veille") setTimeout(()=>{ if(F.mood===apres) mood("veille"); }, 2200);
  repriseOreille();
}

const NOMBRES = {un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16};
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[?!.,]/g," ").replace(/[-’']/g,m=>m==="-"?" ":"'").replace(/\s+/g," ").trim();
const MODES = "ligne|metro|rer|bus|tram|tramway|transilien|train";
function lireTrajet(q){
  let t = " "+norm(q)+" ";
  t = t.replace(new RegExp(`\\b(${MODES})\\s+(${Object.keys(NOMBRES).join("|")})\\b`,"g"), (m,a,b)=>`${a} ${NOMBRES[b]}`);
  let ligne = "", mode = "";
  const ml = t.match(/\b(rer|transilien|train)\s+([a-eh-lnpru])\b/) || t.match(new RegExp(`\\b(${MODES})\\s+(?:numero\\s+)?([a-z]?\\d{1,3}[a-z]?)\\b`));
  if(ml){ mode = ml[1]; ligne = ml[2].toUpperCase(); t = t.replace(ml[0]," "); }
  t = t.replace(/\b(c'?est quand|est ce que|dans combien de temps|combien de temps|dans combien|quand est ce|a quelle heure|quelle heure|le prochain|la prochaine|les prochains|prochains?|prochaines?|il passe|passe|il arrive|arrive|il y a|s'il te plait|stp|svp|dis moi|je veux|je voudrais|je dois|je vais|aller|prendre|pour aller|il part|part|quand|nexxus|metro|rer|bus|tramway|tram|transilien|train)\b/g," ").replace(/\s+/g," ").trim();
  let de = "", vers = "", m;
  if((m = t.match(/^(.*?)\s*\b(?:vers|en direction de|direction|jusqu'a|jusqu a)\b\s+(.+)$/))){ de = m[1]; vers = m[2]; }
  else if((m = t.match(/^(?:de|depuis|a partir de)\s+(.+)\s+(?:a|au|pour)\s+(.+)$/))){ de = m[1]; vers = m[2]; }
  const net = s => s.replace(/^(?:a partir de|depuis|de la station|a la station|station|arret|gare de|de|du|des|a|au|aux|pour)\s+/,"").trim();
  de = net(de); vers = net(vers);
  return (ligne || (de && vers && /\b(metro|rer|bus|tram|train|prochain|combien|quand|passe|direction)\b/.test(norm(q)))) ? {ligne, mode, de, vers} : null;
}
// noms venant de l'API : on enlève juste « (Paris) » ; noms tapés par toi : majuscules propres
const joli = s => String(s||"").replace(/\s*\(.*?\)\s*/g," ").trim();
const PETITS = new Set(["de","du","des","la","le","les","sur","sous","et","en","a","aux"]);
const titre = s => joli(s).split(/(\s+|-)/).map((w,i)=> (i && PETITS.has(w.toLowerCase())) ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1)).join("");
const minutes = iso => Math.max(0, Math.round((new Date(iso) - Date.now())/60000));

const ORDRE_VERROU = /\b(verrouille|verrouillage|bonne nuit|eteins toi|eteint toi|mode veille|lock)\b/;
const ORDRE_FERMER = /^(ferme|ferme la fiche|ferme ca|c'est bon|cache la fiche)$/;
let occupe = false, attente = null, attenteImage = null, ficheTitre = "", jeuSecret = "";
async function poser(q, image=null){

  const n = norm(q);
  const court = n.split(" ").length <= 5;
  if(court && ORDRE_VERROU.test(n)) return verrouiller();
  if(pfc.actif){ const r = jouerPfc(n); if(r) return r; }          // pierre-feuille-ciseaux en cours (avant « stop »)
  if(court && /^(stop|tais toi|chut|silence)$/.test(n)){ return; }
  if(ORDRE_FERMER.test(n)){ fermerFiche(); return dire("C'est fermé.", "veille", q); }

  if(ms){ choisirStyle(ms[1]); return dire({pote:"Ok, on reste potes.", majordome:"Très bien, Monsieur. À votre service.", sarcastique:"Oh génial, encore un changement. Allez, c'est parti.", prof:"Parfait, on va apprendre plein de choses ensemble."}[ms[1]], "content", q); }
  if(court && /^(nouvelle conversation|oublie tout ca|on repart de zero)$/.test(n)){ historique = []; sauverHisto(); fermerFiche(); return dire("C'est noté, on repart de zéro.", "content", q); }

  if(court && musiqueNom && /^(moins fort|baisse( le son)?)$/.test(n)){ musiqueVol = Math.max(.1, musiqueVol-.2); volumeMusique(); return; }

  // pierre-feuille-ciseaux : géré ici, pour que je ne puisse pas tricher
  if(/pierre.{0,6}feuille.{0,6}ciseaux?|chifoumi/.test(n)) return lancerPfc(q);

  if(court && /^(fin des devoirs|stop les devoirs|arrete le mode devoirs|j'ai fini mes devoirs)$/.test(n)){ basculerDevoirs(false); return dire("Bravo pour le travail ! Mode devoirs désactivé.", "content", q); }
  // « regarde ça », « c'est quoi ça » : on ouvre la caméra
  if(!image && n.split(" ").length <= 8 && /^(regarde( ca)?|prends une photo|c'est quoi ca|qu'est ce que c'est que ca|qu'est ce que c'est|tu vois quoi|qu'est ce que tu vois|(je te )?montre (ca|quelque chose)|lis (ca|ce texte)|aide moi avec (ca|cet exercice))( stp| s'il te plait)?$/.test(n)) return ouvrirCamera(q);
  occupe = true; $("hint").hidden = true;

    return attente ? suivante() : annonces.length ? viderAnnonces() : repriseOreille();
  }

  else if(rep.fiche){ ficheTitre = rep.fiche.titre||""; ouvrirFiche(rep.fiche, rep.demo); }

  else if(!rep.suite){ fermerFiche(); jeuSecret = ""; }              // changement de sujet : la fiche se ferme

  attente ? suivante() : annonces.length ? viderAnnonces() : repriseOreille();
}

class ParleurClaude {
  constructor(){
    this.t = CAP.tts; this.tampon = ""; this.n = 0; this.proms = []; this.total = 0; this.envoye = 0; this.debuts = [];
    this.joue = false; this.echec = null; this.tout = ""; this.termine = false;
    this.fini = new Promise(r=> this.finir = r);
    pauseOreille(); baisserMusique(true);
    stopParole = ()=>{ interrompu = true; this.t.stop().catch(()=>{}); };
    this.offs = [
      this.t.onState(({state})=>{ F.pause = state!=="speaking"; }),
      this.t.onLine(({id})=>{ this.joue = true; this.ligne = +id; F.pause = false; mood("parle"); }),
      this.t.onPosition(({ms, id})=>{ const k = +id; progression = Math.min(1, ((this.debuts[k]||0) + ms*REG.debit/62)/Math.max(this.total,1)); }),
    ];
  }
  ajouter(txt){
    if(!txt || interrompu) return;
    this.total += txt.length; this.tout += (this.tout ? " " : "") + txt;
    if(this.n===0) return this.envoyer(txt);                     // la 1re phrase part tout de suite
    this.tampon = this.tampon ? this.tampon + " " + txt : txt;
    if(this.tampon.length >= 160) this.vider();                  // ensuite, par paragraphes
  }
  vider(){ if(this.tampon){ const t = this.tampon; this.tampon = ""; this.envoyer(t); } }
  envoyer(txt){
    if(this.echec || interrompu) return;
    if(this.n===0){ F.pause = true; mood("parle"); }
    const id = String(this.n++); this.debuts.push(this.envoye); this.envoye += txt.length;
    const p = this.t.add([{text:txt.slice(0,2000), voice:REG.voixClaude, language:"fr", id}], {rate:REG.debit})
      .catch(e=>{ if(e.code==="not_granted" || e.code==="unavailable") ttsRefuse = true; if(e.code!=="stopped") this.echec = e.code; else interrompu = true; });
    this.proms.push(p);
  }
  fin(){
    this.vider(); this.termine = true;
    (async()=>{
      while(true){ const k = this.proms.length; await Promise.all(this.proms); if(this.proms.length===k) break; }
      // la voix de Claude n'a pas pu démarrer (ex. pas encore touché la page) : voix du navigateur à la place
      if(!this.joue && this.echec && !ttsRefuse && !interrompu && this.tout) await voixNavigateur(this.tout);
      this.offs.forEach(f=>f()); F.pause = false; stopParole = null; audioLive = false; baisserMusique(false); progression = 1;
      this.finir();
    })();
  }
}
class Parleur {
  constructor(){ this.file = []; this.termine = false; this.dits = 0; this.total = 0; this.azure = voixOn && !horsLigne; this.reveil = null;
    this.fini = new Promise(r=> this.finir = r); this.boucle(); }
  ajouter(txt){
    if(!txt) return;
    const it = {txt};
    if(this.azure){ it.p = audioAzure(txt); it.p.catch(()=>{}); }
    this.total += txt.length; this.file.push(it); if(this.reveil){ this.reveil(); this.reveil = null; }
  }
  fin(){ this.termine = true; if(this.reveil){ this.reveil(); this.reveil = null; } }
  async boucle(){
    pauseOreille(); baisserMusique(true);
    while(true){
      if(interrompu) break;
      if(!this.file.length){
        if(this.termine) break;
        F.pause = true;
        await new Promise(r=> this.reveil = r);
        continue;
      }
      const it = this.file.shift();
      if(fillerEnCours) await fillerEnCours;                    // laisse finir « je cherche ça »
      F.pause = false; mood("parle");
      if(!voixOn){ this.dits += it.txt.length; continue; }
      let ok = false;
      if(it.p){
        try{
          const url = await it.p;
          const avant = this.dits, total = ()=> Math.max(this.total, 1);
          const suivi = setInterval(()=>{ if(audioEl.duration) progression = Math.min(1, (avant + it.txt.length*audioEl.currentTime/audioEl.duration)/total()); }, 100);
          const continuer = await jouer(url).finally(()=>clearInterval(suivi));
          URL.revokeObjectURL(url); audioLive = false; ok = true;
          if(!continuer) interrompu = true;
        }catch(e){ audioLive = false; this.azure = false; }      // la voix réaliste a lâché : voix du téléphone pour la suite
      }
      if(!ok && !interrompu) await voixNavigateur(it.txt);
      this.dits += it.txt.length; progression = Math.min(1, this.dits/Math.max(this.total,1));
    }
    F.pause = false; stopParole = null; audioLive = false; baisserMusique(false);
    this.finir();
  }
}

function blobDepuisDataURL(d){
  const [tete, b64] = d.split(","), bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], {type:(tete.match(/data:([^;]+)/)||[])[1] || "image/jpeg"});
}
async function repondreClaude(q, image, premierTexte){
  const tours = [{role:"user", content:consignesClaude()}, ...historique.map(h=>({role:h.role, content:String(h.content).slice(0,2000)})).filter(h=>h.content.trim()),
    {role:"user", content:(image && !CAP.images ? "[J'ai voulu te montrer une photo, mais elle n'a pas pu être envoyée ici] " : "") + q}];
  historique.push({role:"user", content:(image ? "[photo] " : "") + q}); historique = historique.slice(-12);
  const ctrl = new AbortController(); fluxCtrl = ctrl;
  const etatP = {panneau:false};
  const parleur = (voixOn && CAP.tts && !ttsRefuse) ? new ParleurClaude() : new Parleur();
  let brut = "", envoye = 0, emoFixee = false, ficheFermee = false, premier = true, propre = "";
  const TAG = /\[(neutre|content|perdu|surpris|fache|triste|clin|suite)\]/g;
  const nettoyer = t=>{ const k = t.lastIndexOf("["); if(k > t.lastIndexOf("]")) t = t.slice(0, k); return t.replace(TAG, "").replace(/\*\*|\*|#/g, "").replace(/\s+/g, " ").replace(/^\s+/, ""); };
  const envoyerPhrase = t=>{
    t = t.trim(); if(!t) return;
    if(!ficheFermee && !etatP.panneau && !/\[suite\]/.test(brut) && ficheOn){ fermerFiche(); jeuSecret = ""; ficheFermee = true; }
    parleur.ajouter(t);
  };
  const traiter = (final=false)=>{
    if(!emoFixee){ const m = brut.match(/\[(neutre|content|perdu|surpris|fache|triste|clin)\]/); if(m){ emoFixee = true; emotion(m[1]!=="neutre" ? m[1] : null); } }
    propre = nettoyer(brut);
    if(propre.trim() && premier){ premier = false; premierTexte(); }
    majCaptionFlux(q, propre);
    let reste = propre.slice(envoye);
    while(true){
      const re = /[.!?…:;](?=\s)/g; let m, coupe = -1;
      while((m = re.exec(reste))){ if(m.index + 1 >= (envoye ? 40 : 12)){ coupe = m.index + 1; break; } }
      if(coupe < 0) break;
      envoyerPhrase(reste.slice(0, coupe)); envoye += coupe; reste = propre.slice(envoye);
    }
    if(final && reste.trim()){ envoyerPhrase(reste); envoye = propre.length; }
  };
  const opts = {modelTier:"quick", cache:false, signal:ctrl.signal, onText:({text})=>{ brut = text; traiter(); }};   // le modèle le plus léger : moins cher et plus rapide
  if(CAP.outils){ opts.tools = outilsClaude(etatP); delete opts.cache; }
  if(image && CAP.images) opts.images = [blobDepuisDataURL(image)];
  let erreur = null;
  try{ const r = await CAP.sample(tours, opts); brut = r.text; }
  catch(e){ erreur = e; if(e && e.text) brut = e.text; }
  fluxCtrl = null;
  traiter(true);
  if(erreur && erreur.code!=="cancelled" && !propre.trim()){
    const c = erreur.code;
    if(c==="not_granted" || c==="sampling_disabled" || c==="not_declared" || c==="capability_disabled"){ cerveauRefuse = true; parleur.ajouter("Tu n'as pas autorisé Claude à me faire réfléchir, alors je repasse en mode simple. Tu peux l'autoriser dans les permissions de la page."); }
    else if(c==="rate_limited") parleur.ajouter("J'ai beaucoup parlé, ma limite est atteinte pour le moment. Réessaie un peu plus tard.");
    else if(c==="refused") parleur.ajouter("Je préfère ne pas répondre à ça. On parle d'autre chose ?");
    else parleur.ajouter("Petit souci de connexion avec mon cerveau. Réessaie dans un instant.");
    emotion("perdu");
  }
  parleur.fin();
  await parleur.fini;
  const dit = propre.trim();
  if(dit){ historique.push({role:"assistant", content:dit}); sauverHisto(); } else historique.pop();
  const hm = brut.match(/\[(neutre|content|perdu|surpris|fache|triste|clin)\]/);
  return {dejaDit:true, txt:dit, mood:{content:"content", perdu:"perdu"}[hm?.[1]]||(erreur && erreur.code!=="cancelled" ? "perdu" : "veille"),
          suite:/\[suite\]/.test(brut), panneauRecu:etatP.panneau, ficheFermee};
}

async function repondreFlux(q, image, premierTexte){
  const corps = {messages:[...historique, {role:"user", content:(image ? "[photo] " : "") + q}].slice(-12),
    fiche_ouverte: ficheOn ? ficheTitre : "", style: REG.style, image: image ? image.split(",")[1] : "", jeu_secret: jeuSecret, devoirs: !!REG.devoirs, ...donneesLocales()};
  const ctrl = new AbortController(); fluxCtrl = ctrl;
  const garde = setTimeout(()=>ctrl.abort(), image ? 90000 : 70000);

  try{
    r = await fetch(`${CONFIG.relay}?a=ia_flux`, {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corps), signal:ctrl.signal});
  }catch(e){ clearTimeout(garde); fluxCtrl = null; return interrompu ? {dejaDit:true, mood:"veille"} : null; }

  const parleur = new Parleur();
  let brut = "", envoye = 0, fin = null, panneauRecu = false, emoFixee = false, ficheFermee = false, premier = true, propre = "";
  const TAG = /\[(neutre|content|perdu|surpris|fache|triste|clin|suite)\]/g;
  const nettoyer = t=>{ const k = t.lastIndexOf("["); if(k > t.lastIndexOf("]")) t = t.slice(0, k); return t.replace(TAG, "").replace(/\*\*|\*|#/g, "").replace(/\s+/g, " ").replace(/^\s+/, ""); };
  const traiter = (final=false)=>{
    if(!emoFixee){ const m = brut.match(/\[(neutre|content|perdu|surpris|fache|triste|clin)\]/); if(m){ emoFixee = true; emotion(m[1]!=="neutre" ? m[1] : null); } }
    propre = nettoyer(brut);
    if(propre.trim() && premier){ premier = false; premierTexte(); }
    majCaptionFlux(q, propre);
    let reste = propre.slice(envoye);
    while(true){
      const re = /[.!?…:;](?=\s)/g; let m, coupe = -1;
      while((m = re.exec(reste))){ if(m.index + 1 >= (envoye ? 40 : 12)){ coupe = m.index + 1; break; } }   // 1re phrase courte pour démarrer vite
      if(coupe < 0) break;
      envoyerPhrase(reste.slice(0, coupe)); envoye += coupe; reste = propre.slice(envoye);
    }
    if(final && reste.trim()){ envoyerPhrase(reste); envoye = propre.length; }
  };
  const envoyerPhrase = t=>{
    t = t.trim(); if(!t) return;
    if(!ficheFermee && !panneauRecu && !/\[suite\]/.test(brut) && ficheOn){ fermerFiche(); jeuSecret = ""; ficheFermee = true; }   // nouveau sujet
    parleur.ajouter(t);
  };
  const panneau = p=>{
    panneauRecu = true;
    if(p.type==="jeu") ouvrirJeu(p.data); else if(p.type==="infos") ouvrirInfos(p.data);
    else if(p.type==="fiche"){ ficheTitre = p.data.titre||""; ouvrirFiche(p.data); }
    else if(p.type==="tableau") ouvrirTableau(p.data);
    else if(p.type==="agenda"){ agenda = p.data; ouvrirAgenda(); }
  };
  try{
    const lecteur = r.body.getReader(), dec = new TextDecoder();
    let tampon = "";
    while(true){
      const {value, done} = await lecteur.read(); if(done) break;
      tampon += dec.decode(value, {stream:true}).replace(/\r\n/g, "\n");
      let i;
      while((i = tampon.indexOf("\n\n")) >= 0){
        const bloc = tampon.slice(0, i); tampon = tampon.slice(i+2);
        let ev = "message", data = "";
        bloc.split("\n").forEach(l=>{ if(l.startsWith("event:")) ev = l.slice(6).trim(); else if(l.startsWith("data:")) data += l.slice(5).trim(); });
        if(!data) continue;
        let d; try{ d = JSON.parse(data); }catch(e){ continue; }
        if(ev==="texte"){ brut += d.t||""; traiter(); }
        else if(ev==="panneau") panneau(d);
        else if(ev==="fin") fin = d;
        else if(ev==="erreur") fin = {erreur:true};
      }
    }
  }catch(e){ /* coupé (nouvelle question ou délai) */ }
  clearTimeout(garde); fluxCtrl = null;
  traiter(true); parleur.fin();
  if(fin?.erreur && !propre.trim()){ parleur.ajouter("Je n'arrive pas à joindre mon cerveau. Réessaie dans un instant."); mood("perdu"); }

  return {dejaDit:true, txt:dit, mood:{content:"content", perdu:"perdu"}[humeur]||"veille", actions:fin.actions||[], agenda:fin.agenda, souvenirs:fin.souvenirs,
          fiche:fin.fiche, suite:!!fin.suite, panneauRecu, ficheFermee};

/* ---------------- MICRO ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let ecouteEnCours = false;
// micro dans l'appli Claude : la dictée de Claude (doit démarrer directement depuis le toucher)
function ecouterDictee(pour){
  const d = CAP.dict;
  return new Promise(res=>{
    pauseOreille(); arreterBruit(); ecouteEnCours = true; baisserMusique(true);
    let texte = "", partiel = "", fini = false, silenceT = null, maxT = null;
    const offs = [];
    const terminer = val=>{ if(fini) return; fini = true; clearTimeout(silenceT); clearTimeout(maxT); offs.forEach(f=>f()); ecouteEnCours = false; dicteeEnCours = null; baisserMusique(false); res(val); };
    const arret = ()=> d.stop().catch(()=>{});
    const relancer = ()=>{ clearTimeout(silenceT); silenceT = setTimeout(arret, (texte || partiel) ? 1300 : 7000); };   // il s'arrête tout seul quand tu as fini de parler
    const montrer = ()=>{ const t = (texte + (partiel ? " " + partiel : "")).trim(); if(pour==="question") sousTitre("", t || "…", ""); else if(t) $("lkHint").textContent = "« " + t + " »"; };
    offs.push(d.onPartial(({text})=>{ partiel = text; montrer(); relancer(); }));
    offs.push(d.onFinal(({text})=>{ texte += text; partiel = ""; montrer(); relancer(); }));
    offs.push(d.onState(({state, reason})=>{
      if(state==="listening"){ SFX.blip(); if(pour==="question"){ mood("ecoute"); sousTitre("", "…", ""); } else lockTexte("J'écoute", "Dis ta phrase secrète"); relancer(); }
      if(state==="idle"){
        if(reason==="unavailable" && !dicteeSansLangue){ dicteeSansLangue = true; }
        const refus = ["not_granted","unavailable"].includes(reason);
        terminer(refus && !texte.trim() ? null : (texte + " " + partiel).trim());
      }
    }));
    maxT = setTimeout(arret, 25000);
    dicteeEnCours = arret;
    d.start(dicteeSansLangue ? undefined : {language:"fr"}).catch(e=>{
      if(e.code==="unavailable" && !dicteeSansLangue) dicteeSansLangue = true;
      if(e.code==="dismissed"){ terminer(""); return; }
      terminer(["not_granted","unavailable","no_gesture"].includes(e.code) && !texte.trim() ? null : texte.trim());
    });
  });
}
let dicteeEnCours = null;
function ecouter(pour){
  arreterBruit();
  if(CAP.dict) return ecouterDictee(pour);
  return new Promise(res=>{
    if(!SR) return res(null);
    if(ecouteEnCours) return res("");
    pauseOreille();
    ecouteEnCours = true;
    const rec = new SR(); rec.lang = "fr-FR"; rec.interimResults = true;
    let final = "", refuse = false;
    rec.onstart = ()=>{ SFX.blip(); if(pour==="question"){ mood("ecoute"); sousTitre("", "…", ""); } else lockTexte("J'écoute", "Dis ta phrase secrète"); };
    rec.onresult = ev=>{ const r = ev.results[ev.results.length-1]; if(pour==="question") sousTitre("", r[0].transcript, ""); if(r.isFinal) final = r[0].transcript; };
    rec.onerror = ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed") refuse = true; };
    baisserMusique(true);
    rec.onend = ()=>{ ecouteEnCours = false; baisserMusique(false); setTimeout(demarrerBruit, 800); res(refuse ? null : final); };
    try{ rec.start(); }catch(e){ ecouteEnCours = false; res(null); }
  });
}
async function toucher(){
  if(dicteeEnCours){ dicteeEnCours(); return; }          // toucher pendant qu'il écoute = « j'ai fini »
  initAudio();
  if(!$("reglages").hidden){ fermerReglages(); return; }
  if(sonnerie){ arreterSonnerie(); return; }
  if(etat==="verrou"){
    const p = await ecouter("phrase");
    if(p===null){ ouvrirClavier("Tape ta phrase secrète"); lockTexte("Micro indisponible", "Tape ta phrase secrète en bas"); return; }
    if(!p){ lockTexte("Système verrouillé", "Je n'ai rien entendu. Touche et réessaie."); repriseOreille(); return; }
    return identifier(p);
  }
  if(etat!=="actif") return;
  if(F.mood==="parle"){ interrompre(); return; }          // toucher pendant qu'il parle = le couper
  if(occupe) return;
  const q = await ecouter("question");
  if(q===null){ ouvrirClavier(); return dire(CAP.dict ? "Je n'ai pas accès au micro. Autorise la dictée dans les permissions de la page, ou écris-moi." : "Le micro n'est pas disponible ici. Ouvre la page dans Chrome ou l'appli Claude sur ordinateur, ou écris-moi.", "perdu"); }
  if(!q){ mood("veille"); $("caption").classList.add("fade"); repriseOreille(); return; }
  poser(q);
}

/* mode mains libres : il écoute en continu et réagit quand tu dis son nom */
let oreille = false, oreilleRec = null, oreilleTimer = null;
const MOT_EVEIL = new RegExp("\\b(" + [CONFIG.nom.toLowerCase(), "nexus", "next us", "nexxus", "nex us", "nexy"].join("|") + ")\\b");
function oreilleActive(){ return oreille && SR && !ecouteEnCours && !occupe && F.mood!=="parle" && (etat==="actif" || etat==="verrou"); }
function repriseOreille(){
  clearTimeout(oreilleTimer);
  oreilleTimer = setTimeout(()=>{
    if(!oreilleActive() || oreilleRec) return;
    const rec = new SR(); rec.lang = "fr-FR"; rec.continuous = true; rec.interimResults = false;
    rec.onresult = ev=>{
      const t = ev.results[ev.results.length-1][0].transcript, n = norm(t), m = n.match(MOT_EVEIL);
      if(!m) return;
      const reste = t.slice(Math.max(0, t.toLowerCase().indexOf(m[1]) + m[1].length)).replace(/^[\s,.!?]+/, "").trim();
      pauseOreille();
      if(etat==="verrou"){ reste ? identifier(reste) : toucher(); }
      else if(reste.split(" ").length >= 2) poser(reste);
      else toucher();
    };
    rec.onerror = ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){ oreille = false; majOreille(); } };
    rec.onend = ()=>{ oreilleRec = null; if(oreilleActive()) repriseOreille(); };
    try{ rec.start(); oreilleRec = rec; }catch(e){ oreilleRec = null; }
  }, 350);
}
function pauseOreille(){ clearTimeout(oreilleTimer); if(oreilleRec){ const r = oreilleRec; oreilleRec = null; r.onend = null; try{ r.abort(); }catch(e){} } }
function majOreille(){
  $("earBtn").classList.toggle("on", oreille);
  $("earBtn").setAttribute("aria-pressed", oreille ? "true" : "false");
  try{ localStorage.setItem("nexxus_oreille", oreille ? "1" : "0"); }catch(e){}
  if(etat==="verrou") $("lkHint").textContent = oreille ? "Dis « " + CONFIG.nom + " » puis ta phrase secrète" : "Touche l'écran et dis ta phrase secrète";
  $("hint").textContent = oreille ? "Dis « " + CONFIG.nom + " » ou touche le visage" : "Touche le visage pour parler";
}
$("earBtn").onclick = e=>{
  e.stopPropagation(); initAudio();
  if(!SR){ sousTitre("", "La reconnaissance vocale n'est pas disponible dans ce navigateur. Utilise Chrome.", ""); return; }
  oreille = !oreille; majOreille(); if(oreille){ arreterBruit(); repriseOreille(); } else { pauseOreille(); demarrerBruit(); }
};

let musiqueNom = "", musiqueVol = .6, musiqueBaisse = false;
function volumeMusique(){ musique.volume = Math.min(1, musiqueVol*volumeEffectif()*(musiqueBaisse ? .18 : 1)); }
function baisserMusique(oui){ musiqueBaisse = oui; if(musiqueNom) volumeMusique(); }
function jouerMusique(url, nom){

  musique.src = url; volumeMusique();

const rappelsSonnes = new Set();
async function chargerAgenda(){
  if(horsLigne || stockageLocal || etat!=="actif") return;
  try{ const r = await requete("agenda", undefined, 8000); if(r.ok) agenda = await r.json(); }catch(e){}
}

function quandLisible(iso){
  const d = new Date(iso), auj = new Date(), dem = new Date(Date.now()+86400000);
  const jour = d.toDateString()===auj.toDateString() ? "Aujourd'hui" : d.toDateString()===dem.toDateString() ? "Demain" : d.toLocaleDateString("fr-FR",{weekday:"short", day:"numeric", month:"short"});
  return `${jour} · ${fmtH(d)}`;
}
function verifierRappels(){
  const now = Date.now();
  (agenda.rappels||[]).forEach(r=>{
    if(rappelsSonnes.has(r.id) || new Date(r.quand).getTime() > now) return;
    rappelsSonnes.add(r.id);
    const enRetard = now - new Date(r.quand).getTime() > 5*60000;
    const bip = ()=>{ ton(1046,1046,.16,"sine",.13); ton(1318,1318,.16,"sine",.13,.18); ton(1568,1568,.3,"sine",.13,.36); HUD.flash = .6; };
    bip(); setTimeout(bip, 1600);
    const txt = (enRetard ? "Rappel manqué : " : "Rappel : ") + r.texte;
    if(etat!=="actif") sousTitre("", "🔔 " + txt, "");
    annoncer(txt + ".", "surpris");          // dit tout de suite, ou dès qu'il a fini de parler / dès le déverrouillage
    if(!horsLigne && !stockageLocal) requete("rappel_fait", {id:r.id}, 8000).then(x=>x.ok && x.json()).then(a=>{ if(a) agenda = a; }).catch(()=>{});
    else { agenda.rappels = agenda.rappels.filter(x=>x.id!==r.id); sauverAgendaLocal(); }
  });
}

let minuteurs = [], sonnerie = null;

function executerAction(a){

  if(a.type==="stop_musique") stopMusique();
}
function annulerMinuteurs(){ minuteurs = []; sauverMinuteurs(); afficherMinuteurs(); arreterSonnerie(); }
function fmtDuree(ms){ const s = Math.ceil(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); }
function afficherMinuteurs(){
  const box = $("timers"); box.textContent = "";
  if(REG.devoirs){ const d = el("button","timer"); d.type = "button"; d.title = "Quitter le mode devoirs";
    d.append(el("span","t-val","✎"), el("span","t-nom","Mode devoirs"), el("span","t-nom","✕"));

    m.onclick = e=>{ e.stopPropagation(); stopMusique(); }; box.appendChild(m); }
  minuteurs.forEach(m=>{
    const c = el("button","timer"); c.type = "button"; c.title = "Annuler";
    c.append(el("span","t-nom", m.nom), el("span","t-val", fmtDuree(m.fin-Date.now())));
    c.onclick = e=>{ e.stopPropagation(); minuteurs = minuteurs.filter(x=>x.id!==m.id); sauverMinuteurs(); afficherMinuteurs(); };
    box.appendChild(c);
  });
}
function sonner(m){
  arreterSonnerie();
  const bip = ()=>{ ton(880,880,.18,"square",.12); ton(1175,1175,.18,"square",.12,.22); ton(880,880,.18,"square",.12,.44); HUD.flash = .7; };
  bip(); sonnerie = setInterval(bip, 1400);
  setTimeout(arreterSonnerie, 60000);
  annoncer(`${m.nom} terminé !`, "surpris", "content");
  sousTitre("", `⏰ ${m.nom} terminé. Touche l'écran pour arrêter.`, "");

  const fini = minuteurs.filter(m=>m.fin<=Date.now());
  if(fini.length){ minuteurs = minuteurs.filter(m=>m.fin>Date.now()); sauverMinuteurs(); fini.forEach(sonner); }
  afficherMinuteurs();
}, 500);

}
const VOIX_CLAUDE = {buttery:"Douce", airy:"Légère", glassy:"Claire", rounded:"Ronde"};
const VOIX_AZURE = {"fr-FR-RemyMultilingualNeural":"Rémy", "fr-FR-VivienneMultilingualNeural":"Vivienne", "fr-FR-HenriNeural":"Henri", "fr-FR-DeniseNeural":"Denise"};
function majVoix(){
  const box = $("rVoix"); box.textContent = "";
  const azure = !horsLigne, claudeV = horsLigne && CAP.tts && !ttsRefuse;
  const liste = azure ? VOIX_AZURE : claudeV ? VOIX_CLAUDE : null, cle = azure ? "voixAzure" : "voixClaude";
  $("rVoixNote").textContent = azure ? "Voix Microsoft, via ton serveur." : claudeV ? "Voix de Claude. Le français peut rendre deux voix proches." : "Voix du téléphone (les voix réalistes marchent dans Chrome, l'appli Claude ou sur ton serveur).";
  if(!liste) return;
  Object.entries(liste).forEach(([k,lab])=>{ const b = el("button", REG[cle]===k ? "on" : "", lab); b.type = "button"; b.setAttribute("aria-pressed", REG[cle]===k);
    b.onclick = ()=>{ REG[cle] = k; sauverReglages(); majVoix(); essaiVoix(); }; box.appendChild(b); });
}
function essaiVoix(){
  interrompre(); interrompu = false;
  if(etat==="actif" && !occupe) dire("Salut, c'est ma nouvelle voix. Elle te plaît ?", "content");
}
function fermerReglages(){ $("reglages").hidden = true; }
construireReglages(); majReglages(); majDevoirs(); majBruit();
$("gearBtn").onclick = e=>{ e.stopPropagation(); initAudio(); majVoix(); $("rDebit").value = REG.debit; $("reglages").hidden = !$("reglages").hidden; };
$("rDebit").oninput = ()=>{ REG.debit = +$("rDebit").value; sauverReglages(); try{ const r = CAP.tts?.setRate?.(REG.debit); r?.catch?.(()=>{}); }catch(e){} };
$("rDebit").onchange = ()=> essaiVoix();
$("rClose").onclick = fermerReglages;
$("reglages").onclick = e=> e.stopPropagation();
$("rVol").oninput = ()=>{ REG.volume = +$("rVol").value; sauverReglages(); volumeMusique(); };
$("rVol").onchange = ()=> SFX.blip();
$("rVerrou").onchange = ()=>{ REG.verrou = +$("rVerrou").value; sauverReglages(); };
$("rBrief").onclick = ()=>{ if(etat==="actif") lancerBriefing(); };
$("rBruit").onclick = ()=>{ REG.bruit = !REG.bruit; sauverReglages(); majBruit(); SFX.blip(); REG.bruit ? demarrerBruit() : arreterBruit(); };
$("rDevoirs").onclick = ()=>{ basculerDevoirs(!REG.devoirs); SFX.blip(); };
$("rOubli").onclick = ()=>{ fermerReglages(); historique = []; sauverHisto(); fermerFiche(); jeuSecret = ""; pfc.actif = false; if(etat==="actif") dire("C'est noté, on repart de zéro.", "content"); };
$("rDiag").onclick = async ()=>{
  const box = $("rDiagRes"); box.hidden = false; box.textContent = "";
  box.appendChild(el("span","r-lab","Test en cours…"));
  if(horsLigne || etat!=="actif"){ box.textContent = ""; box.appendChild(el("small","", "Le test se lance une fois le compagnon installé sur ton site et déverrouillé.")); return; }
  try{
    const r = await requete("diag", undefined, 60000);
    if(r.status===401){ box.textContent = "Session expirée : déverrouille-le à nouveau."; return; }
    const j = await r.json(); box.textContent = "";
    const ok = j.tests.filter(t=>t.ok).length;
    box.appendChild(el("span","r-lab", `${ok} / ${j.tests.length} vérifications réussies`));
    const g = el("div","diag");
    j.tests.forEach(t=>{
      const info = el("div"); info.append(el("b","", t.nom), el("small","", t.detail));
      if(t.aide) info.appendChild(el("small","aide", "→ " + t.aide));
      g.append(el("span", "ic " + (t.ok ? "ok" : "ko"), t.ok ? "✓" : "✗"), info);
    });
    box.appendChild(g);
  }catch(e){ box.textContent = "Le relais ne répond pas : vérifie que relay.php est bien dans le même dossier."; }
};
document.addEventListener("keydown", e=>{ if(e.key!=="Escape") return;
  let ferme = false;
  if(!$("reglages").hidden){ fermerReglages(); ferme = true; }
  else if(!$("cam").hidden){ fermerCamera(); ferme = true; }
  else if(ficheOn){ fermerFiche(); ferme = true; }
  if(ferme) e.preventDefault(); });

/* ---------------- VEILLE, NUIT, MÉTÉO LOCALE ---------------- */
let meteoLocale = null;
const CIEL = c => c<=1?"ciel dégagé":c<=3?"nuageux":c<=48?"brouillard":c<=67?"pluie":c<=77?"neige":c<=82?"averses":"orage";
function chargerMeteo(){
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&current=temperature_2m,weather_code&timezone=Europe%2FParis`)
    .then(r=>r.json()).then(j=>{ meteoLocale = {t:Math.round(j.current.temperature_2m), ciel:CIEL(j.current.weather_code)}; }).catch(()=>{});
}
chargerMeteo(); setInterval(chargerMeteo, 30*60000);
setInterval(()=>{
  const d = new Date(), veille = etat==="actif" && F.mood==="dort" && !ficheOn;
  $("veille").classList.toggle("on", veille);
  if(veille){
    $("vTime").textContent = d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    const infos = [d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})];
    if(meteoLocale) infos.push(`${meteoLocale.t}° · ${meteoLocale.ciel}`);
    const pr = (agenda.rappels||[])[0]; if(pr) infos.push(`🔔 ${quandLisible(pr.quand)} — ${pr.texte}`);
    if(musiqueNom) infos.push(`♪ ${musiqueNom}`);
    $("vInfo").textContent = infos.join("  ·  ");
  }
  $("dim").classList.toggle("on", nuit() && (etat==="verrou" || (etat==="actif" && F.mood==="dort")));
}, 1000);

demarrage();
</script>
